apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myapp-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: myapp
    rules:
    - alert: PodDown
      expr: up{namespace="default"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Pod is down"
        description: "A pod in the default namespace has been down for more than 1 minute"
