name: Deploy to EKS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin 450963613371.dkr.ecr.eu-west-2.amazonaws.com

    - name: Build and push Docker image
      run: |
        IMAGE_TAG=${{ github.sha }}
        docker build -t myapp:$IMAGE_TAG .
        docker tag myapp:$IMAGE_TAG 450963613371.dkr.ecr.eu-west-2.amazonaws.com/myapp:$IMAGE_TAG
        docker push 450963613371.dkr.ecr.eu-west-2.amazonaws.com/myapp:$IMAGE_TAG

    - name: Update EKS deployment
      run: |
        IMAGE_TAG=${{ github.sha }}
        aws eks update-kubeconfig --name myapp-cluster --region eu-west-2
        kubectl set image deployment/myapp-deployment myapp=450963613371.dkr.ecr.eu-west-2.amazonaws.com/myapp:$IMAGE_TAG
