apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: 450963613371.dkr.ecr.eu-west-2.amazonaws.com/myapp:v1
        ports:
        - containerPort: 5000
